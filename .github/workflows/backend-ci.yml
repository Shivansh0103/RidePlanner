name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: asia-south1-docker.pkg.dev/ride-planner-504308/rideplanner/rideplanner-api

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'backend/RidePlanner/**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore backend/RidePlanner/RidePlanner.slnx

      - name: Build solution
        run: dotnet build backend/RidePlanner/RidePlanner.slnx --configuration Release --no-restore

      - name: Run test suite
        run: dotnet test backend/RidePlanner/RidePlanner.slnx --configuration Release --no-build --no-restore --nologo

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t rideplanner-api:ci -t ${{ env.IMAGE_NAME }}:${{ github.sha }} backend

      - name: Verify Docker image
        run: docker image inspect rideplanner-api:ci --format '{{.Id}}'

      - name: Authenticate to Google Cloud
        id: auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          project_id: ride-planner-504308
          workload_identity_provider: projects/73286917441/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: rideplanner-ci@ride-planner-504308.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Google Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push Docker image to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if docker manifest inspect ${{ env.IMAGE_NAME }}:${{ github.sha }} > /dev/null 2>&1; then
            echo "Image ${{ env.IMAGE_NAME }}:${{ github.sha }} already exists in Artifact Registry. Skipping push to respect immutable tags."
          else
            docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi
