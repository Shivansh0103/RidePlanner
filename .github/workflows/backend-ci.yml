name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'backend/RidePlanner/**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore backend/RidePlanner/RidePlanner.slnx

      - name: Build solution
        run: dotnet build backend/RidePlanner/RidePlanner.slnx --configuration Release --no-restore

      - name: Run test suite
        run: dotnet test backend/RidePlanner/RidePlanner.slnx --configuration Release --no-build --no-restore --nologo

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t rideplanner-api:ci backend

      - name: Verify Docker image
        run: docker image inspect rideplanner-api:ci --format '{{.Id}}'
