services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rideplanner
      POSTGRES_USER: rideplanner
      POSTGRES_PASSWORD: rideplanner_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideplanner -d rideplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RidePlannerDatabase: "Host=postgres;Port=5432;Database=rideplanner;Username=rideplanner;Password=rideplanner_dev_password"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
